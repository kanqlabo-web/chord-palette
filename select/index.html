<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コード進行パレット（セレクトページ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{ --bg:#EDF0F5; --surface:#FFFFFF; --ink:#1B2230; --muted:#677285; --line:#D3D9E3; --t:#3567D6; --s:#24946A; --d:#DA6A22;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif; --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif; color-scheme:light dark; }
@media (prefers-color-scheme: dark){ :root{ --bg:#11151C; --surface:#1A202A; --ink:#E8ECF3; --muted:#8C97AA; --line:#2B3441; --t:#7EA4FF; --s:#5BCB97; --d:#FF9C5B; } a.card{box-shadow:none} }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom))}
main{width:100%;max-width:440px}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:8px 0 4px;text-align:center}
p.lead{color:var(--muted);text-align:center;margin:0 0 24px;font-size:14px}
a.card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(27,34,48,.06)}
a.card:active{transform:scale(.99)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--surface)}
.card b{font-family:var(--display);font-size:18px;display:block}
.card span{color:var(--muted);font-size:13px;line-height:1.5}
.arrow{margin-left:auto;color:var(--muted);flex:none}
</style>
</head>
<body>
<main>
  <h1>コード進行パレット</h1>
  <p class="lead">使う版を選んでください</p>
  <a class="card" href="../">
    <div class="ic" style="background:var(--t)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
    <div><b>通常版</b><span>ふだん使う版です</span></div>
    <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a class="card" href="../beta/">
    <div class="ic" style="background:var(--d)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7 15h10"/></svg></div>
    <div><b>ベータ版</b><span>試作中の機能を先に試せる版です。保存データは通常版と別です</span></div>
    <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a class="card" href="../lecture/">
    <div class="ic" style="background:var(--s)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
    <div><b>講義版</b><span>先生の端末に合わせて、受講者の画面の機能が少しずつ増えていく版です</span></div>
    <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </a>
</main>
</body>
</html>
